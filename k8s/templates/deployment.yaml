apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sscale.fullname" . }}
  labels:
    {{- include "sscale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # The SQLite database lives on a RWO volume, and only one daemon may own
    # the scale session at a time.
    type: Recreate
  selector:
    matchLabels:
      {{- include "sscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sscale.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sscale.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: sscale
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SSCALE_KEYS
              value: /config/keys.json
            - name: SSCALE_DATA
              value: /data
            - name: SSCALE_HTTP
              value: ":8080"
            - name: DBUS_SYSTEM_BUS_ADDRESS
              value: "unix:path=/run/dbus/system_bus_socket"
            - name: SSCALE_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SSCALE_TRACE
              value: {{ .Values.config.trace | quote }}
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            {{- if .Values.config.adapter }}
            - name: SSCALE_ADAPTER
              value: {{ .Values.config.adapter | quote }}
            {{- end }}
            {{- if .Values.config.apiKey }}
            - name: SSCALE_API_KEY
              value: {{ .Values.config.apiKey | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: keys
              mountPath: /config
              readOnly: true
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sscale.dataClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: keys
          secret:
            secretName: {{ include "sscale.keysSecretName" . }}
            items:
              - key: {{ .Values.keys.secretKey }}
                path: keys.json
        - name: dbus
          hostPath:
            path: {{ .Values.dbus.hostPath }}
            type: Directory
